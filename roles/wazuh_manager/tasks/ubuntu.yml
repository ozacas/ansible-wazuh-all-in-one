---

- name: setup wazuh manager
  block:
    - shell: "curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg --import && chmod 644 /usr/share/keyrings/wazuh.gpg"
      become: yes
    - lineinfile: 
        line: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main" 
        dest: '/etc/apt/sources.list.d/wazuh.list'
        state: present
        regexp: '^deb \[signed-by=/usr/share/keyrings/wazuh'
      become: yes
    - apt: update_cache=yes
      become: yes
    - apt: name="wazuh-manager=4.5.4-1" state=present allow_change_held_packages=yes allow_downgrade=yes # in case wrong version is already on target
      become: yes
    - systemd: name=wazuh-manager enabled=yes masked=no daemon_reload=yes state=restarted
      become: yes
    - command: apt-mark hold wazuh-manager
      become: yes

- name: check it has started successfully or fail deployment
  block:
    - command: systemctl is-active wazuh-manager
      register: results
    - assert:
        that:
          - "'active' in results.stdout"

